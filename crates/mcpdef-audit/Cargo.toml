[package]
name = "mcpdef-audit"
description = "MCPdef — append-only, hash-linked (tamper-evident) audit ledger + offline chain verification (OSS engine, Phase 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mcpdef-core.workspace = true
serde.workspace = true
# `float_roundtrip`: a receipt is checked over its payload written again in
# RFC 8785 form, so a number must read as the double its signer wrote, which
# the default parser can miss by one bit for a long one.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# `LedgerHandle`: the lock appends take turns on, the watch that publishes the
# head, and, under `Durability::Fsync`, the blocking pool each `fsync` runs on.
tokio.workspace = true
# Signed receipts (`receipt`): Ed25519 and P-256 from ring, which is in the
# tree already through rustls, and base64url for their JWKs.
ring.workspace = true
base64.workspace = true
# Writers in other processes, such as hooks, take turns on the ledger's lock.
fd-lock.workspace = true

[dev-dependencies]
tempfile.workspace = true
