[package]
name = "mcpdef-transport"
description = "MCPdef — the Transport trait + stdio child and in-memory duplex transports (OSS engine, Phase 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mcpdef-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-root-certs.workspace = true
# TLS profiles: the host's roots, the CA and CRL checks, and a client identity
# handed to reqwest as the PEM it takes.
rustls-native-certs.workspace = true
webpki.workspace = true
base64.workspace = true
# The client key is a secret reference, read when a profile is loaded; what
# holds the key after is wiped when it is dropped.
mcpdef-secrets.workspace = true
zeroize.workspace = true
# SPKI pins: the SHA-256 of a key, and the handshake `mcpdef tls pin` makes to
# see a server's certificate.
sha2.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
url.workspace = true
# The `Date` an answer carries (`fetch_dated`).
httpdate.workspace = true
# A token endpoint's answer (`[server.auth] kind = "oauth2"`).
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
# A private CA and an HTTPS upstream on it, and the files a TLS profile names.
mcpdef-testkit.workspace = true
tempfile.workspace = true
proptest.workspace = true
axum.workspace = true
tokio-stream.workspace = true
